services:
  # -------------------------------------------------------------------------
  # PVAI Backend Web Service (FastAPI running inside Docker)
  # -------------------------------------------------------------------------
  - type: web
    name: pvai-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon # or appropriate region
    numInstances: 1
    healthCheckPath: /health
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    
    # Mount Persistent Volume for ChromaDB vector embeddings database
    disk:
      name: pvai-chroma-data
      mountPath: /var/data
      sizeGB: 10
      
    # Setup environment variables configuration
    envVars:
      - key: ENV
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false # User inputs Neon PostgreSQL connection string in Render Dashboard
      - key: SECRET_KEY
        generateValue: true # Generates unique secret key automatically
      - key: JWT_SECRET
        generateValue: true # Generates unique JWT secret key automatically
      - key: JWT_ALGORITHM
        value: HS256
      - key: FRONTEND_URL
        value: https://pvai.vercel.app # Override with production Vercel URL
      - key: CORS_ORIGINS
        value: https://pvai.vercel.app
      - key: STORAGE_TYPE
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CHROMA_DB_PATH
        value: /var/data/chromadb
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: LLM_PROVIDER
        value: gemini # Defaults to Gemini in production
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SIMILARITY_THRESHOLD
        value: "0.90"
      - key: LLM_THRESHOLD
        value: "0.70"
