name: PVAI CI/CD Production Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]

jobs:
  # -------------------------------------------------------------------------
  # 1. TEST & SECURITY SCANNING STAGES
  # -------------------------------------------------------------------------
  test_and_scan:
    name: Build, Lint, Test & Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/checkout@v4
      with:
        python-version: '3.12'

    - name: Cache Pip Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install ruff bandit pip-audit

    - name: Run Code Linter (Ruff)
      run: |
        ruff check backend/app

    - name: Run Security Audit (pip-audit)
      # Fail pipeline if there are high/critical vulnerabilities
      run: |
        pip-audit --desc on

    - name: Run Static Application Security Testing (Bandit SAST)
      # Scan app directory, fail on High severity issues
      run: |
        bandit -r backend/app -lll

    - name: Run Test Suite (Unittest discovery)
      env:
        ENV: test
        DATABASE_URL: sqlite+aiosqlite:///:memory:
        SECRET_KEY: test_secret_key_for_ci_cd_pipeline_execution
      run: |
        python -m unittest discover -s backend/app/tests/ -p "test_*.py" -v

  # -------------------------------------------------------------------------
  # 2. DOCKER BUILD STAGE
  # -------------------------------------------------------------------------
  build_docker:
    name: Build & Verify Docker Image
    needs: test_and_scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Local Container Image
      run: |
        docker build -t pvai-backend:latest -f backend/Dockerfile backend/

  # -------------------------------------------------------------------------
  # 3. DEPLOY & SMOKE TEST STAGES (Example Render deploy trigger)
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to Production & Verify
    needs: build_docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Trigger Render Service Deployment
      # Trigger deployment hook URL securely
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        if [ -n "$RENDER_DEPLOY_HOOK" ]; then
          curl -f -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deployment hook triggered successfully."
        else
          echo "RENDER_DEPLOY_HOOK secret is not configured. Skipping deploy trigger."
        fi

    - name: Run Production Smoke Verification
      # Wait briefly for deployment and run check
      run: |
        echo "Executing production verification checks..."
        python scripts/deployment_check.py

    - name: Notify Success Status
      run: |
        echo "PVAI Backend Production Deployment completed successfully."
